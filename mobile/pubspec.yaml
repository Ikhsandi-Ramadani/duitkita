name: duitkita
description: "DuitKita — family finance app."
publish_to: 'none'

version: 1.1.5+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  fl_chart: ^1.2.0
  local_auth: ^3.0.1
  intl: ^0.20.2
  uuid: ^4.5.3
  dio: ^5.9.2
  # HTTP inspector (debug only). Loaded via kDebugMode-gated provider.
  alice: ^1.0.0
  alice_dio: ^1.0.7
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  share_plus: ^11.0.0
  path: ^1.9.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  # lucide_icons 0.257.0 incompatible with Dart 3.12 (IconData is now final)
  # Using Material Icons as fallback

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
