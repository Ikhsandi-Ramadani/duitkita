name: duitkita
description: "DuitKita — family finance app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  fl_chart: ^1.2.0
  local_auth: ^3.0.1
  intl: ^0.20.2
  uuid: ^4.5.3
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  path: ^1.9.0
  # lucide_icons 0.257.0 incompatible with Dart 3.12 (IconData is now final)
  # Using Material Icons as fallback

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
