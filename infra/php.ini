; ==================== Konfigurasi PHP ====================

; Laravel membaca konfigurasi dari variabel lingkungan Docker.
; "E" wajib ada di variables_order supaya $_ENV terisi.
variables_order = "EGPCS"

; Zona waktu
date.timezone = Asia/Makassar

; Unggahan berkas
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
memory_limit = 256M

; Sembunyikan versi PHP dari header balasan
expose_php = Off

; Sesi disimpan di database (lihat SESSION_DRIVER), jadi tidak perlu file
session.gc_probability = 0

; OPcache: menyimpan kode PHP terkompilasi supaya lebih cepat.
; validate_timestamps=0 karena kode tidak berubah saat container berjalan
; (kode baru selalu datang lewat image baru).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Log error: php-fpm resmi sudah mengarahkan log ke stderr.
log_errors = On
display_errors = Off
