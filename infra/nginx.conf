# ==================== Nilai cadangan header proxy ====================
# Caddy di depan mengirim X-Forwarded-Proto/Host/For. Kalau permintaan datang
# LANGSUNG ke container ini (misalnya pemeriksaan kesehatan internal tanpa
# lewat Caddy), header itu tidak ada sehingga isinya kosong.
#
# Laravel mempercayai proxy, jadi header kosong itu bisa membuat error
# "Uninitialized string offset 0" di Request->getPort(). Map ini mengisi nilai
# cadangan dari permintaan aslinya.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_for $proxy_x_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}


server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Berkas statis dilayani langsung; sisanya diarahkan ke Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset hasil build Vite punya nama ber-hash, aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        # php-fpm berjalan di container yang sama (dijalankan supervisord)
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;

        # Dipakai Laravel untuk tahu skema (http/https) dan host asli.
        fastcgi_param HTTP_X_FORWARDED_PROTO $proxy_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST  $proxy_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
