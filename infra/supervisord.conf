; ==================== Pengelola proses aplikasi ====================
; Supervisor menjalankan 4 proses di dalam satu container:
;   1. php-fpm        - mengeksekusi kode PHP
;   2. nginx          - web server
;   3. queue-worker   - memproses antrean (QUEUE_CONNECTION=database)
;   4. scheduler      - menjalankan tugas terjadwal Laravel
;
; Semua log dikirim ke stdout/stderr supaya terbaca lewat `docker logs`
; dan tidak menumpuk di dalam container.

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

; Tanpa dua bagian di bawah, perintah `supervisorctl status` di dalam
; container gagal dengan pesan ".ini file does not include supervisorctl section".
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=5
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:queue-worker]
; --max-time memaksa worker berhenti tiap jam supaya memori tidak menumpuk,
; lalu supervisor menyalakannya kembali.
command=/bin/sh -c "cd /var/www/html && exec php artisan queue:work --tries=3 --max-time=3600 --sleep=3"
priority=20
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=3700
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


[program:scheduler]
command=/bin/sh -c "cd /var/www/html && exec php artisan schedule:work"
priority=20
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
