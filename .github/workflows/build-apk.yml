name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API Base URL'
        required: false
        default: 'https://duitkita.ikhsandi.web.id'
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: |
          API_URL="${{ github.event.inputs.api_url || 'https://duitkita.ikhsandi.web.id' }}"
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=API_BASE_URL="$API_URL/api"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duitkita-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
